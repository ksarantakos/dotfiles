name: Smoke tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: smoke-install
        run: bash test/smoke-install.sh

      - name: smoke-node
        run: bash test/smoke-node.sh

      - name: smoke-vscode
        run: bash test/smoke-vscode.sh

  docker-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04]
    steps:
      - uses: actions/checkout@v4

      - name: docker-install (${{ matrix.image }})
        run: bash test/docker-ubuntu.sh ${{ matrix.image }}
