name: Smoke tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: smoke-install
        run: bash test/smoke-install.sh

      - name: smoke-vscode
        run: bash test/smoke-vscode.sh
